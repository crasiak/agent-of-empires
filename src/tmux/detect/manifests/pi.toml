id = "pi"

# Pi draws a `────` rule above and below its input prompt, so the box's top rule
# is the *second* one counting from the bottom.
[markers.input_box]
line_regex = ['(?i)^\s*─{3,}\s*$']
occurrence = 2
max_depth = 6

# AoE's Pi extension (`assets/session/aoe-session-id.js`) writes the hook file
# at every turn boundary, so a write outranks every screen rule below. Those
# rules are the fallback for a Pi that started without the extension.
[[rules]]
id = "hook_waiting"
state = "waiting"
priority = 1000
region = "hook"
hook_status = "waiting"

[[rules]]
id = "hook_running_fresh"
state = "running"
priority = 1000
region = "hook"
hook_status = "running"
max_age_secs = 30

# Rewritten at every tool start, so an older write outlived its turn.
[[rules]]
id = "hook_running_standing"
state = "running"
priority = 1000
region = "hook"
hook_status = "running"
max_age_secs = 900

[[rules]]
id = "hook_idle"
state = "idle"
priority = 1000
region = "hook"
hook_status = "idle"

# pi-ask-user's prompt frame, by its titled top border and versioned bottom
# border, for a Pi without the extension. It outranks the spinner a turn keeps
# drawing under the overlay.
[[rules]]
id = "ask_user_prompt"
state = "waiting"
priority = 980
region = "whole_recent"
visible = true
line_regex = ['╭─ ask_user [^╮]*─╮', '╰─+ v\d+(?:\.\d+)*\S* ─╯']

# Otherwise the only question is whether a turn is live.
[[rules]]
extends = "spinner"
id = "spinner"
priority = 970
region = "bottom_non_empty_lines(6)"

# The busy line sits directly above the box in plain pi, and behind up to two
# tip lines in derivatives aliased to pi (#3475), so the band is three deep.
[[rules]]
extends = "interrupt_hint"
id = "interrupt_hint"
priority = 965
region = "above(input_box, 3)"

# A parked prompt outranks the activity fallback below: custom wrappers and
# older builds show `pi>` or a bare `>` at rest, and an activity word lingering
# just above it must not flip that back to Running.
[[rules]]
extends = "input_prompt"
id = "input_prompt"
priority = 960
region = "bottom_non_empty_lines(5)"
any = [
  { line_regex = ['(?i)^\s*pi>\s*$'] },
  { line = { regex = ['(?i)^\s*>\s\S.{0,96}$'], not_regex = ['(?i)esc'] } },
]

# Reduced-motion fallback: a footer line that *starts* with a live verb is a
# status line, not narration buried mid-sentence.
[[rules]]
extends = "activity_line"
id = "activity_line"
priority = 950
region = "bottom_non_empty_lines(6)"
