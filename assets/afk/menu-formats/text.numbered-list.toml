id = "text.numbered-list"
sources = ["agent_text", "bash_prompt", "pane"]
kind = "choice"
# "1. Yes" / "2) No" lines (the selected row may carry a > cursor) under a question: a line ending in "?", or ending in ":" with a choice word
option_pattern = '^\s*(?:[>❯›]\s*)?(?P<key>[1-9][0-9]?)[.)]\s+(?P<label>\S.{0,200})$'
trigger = '(?i)(\?\s*$)|(\b(choose|pick|select|which|prefer|options?|would you like|want me to|should i)\b.*:\s*$)'
options_after_trigger = true
min_options = 2
